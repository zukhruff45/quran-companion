services:
  - type: web
    name: quran-companion-backend
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        sync: false
      - key: NODE_ENV
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
